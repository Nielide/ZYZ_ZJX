<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="QQQM 持仓记录" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111111'/%3E%3Cpath d='M16 16h32v8H24v8h18v8H24v8h24v8H16z' fill='%23baff00'/%3E%3C/svg%3E" />
  <title>QQQM · ACCOUNTS</title>
  <style>
    :root {
      --black: #000000;
      --surface: #111111;
      --heading: #292929;
      --text: #5f5f5f;
      --lime: #baff00;
      --red: #ff6f73;
      --radius: 999px;
      --page-pad: clamp(24px, 5.6vw, 60px);
    }

    * { box-sizing: border-box; }
    html { background: var(--black); }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--black);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overscroll-behavior-y: contain;
    }

    button { font: inherit; }
    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(42px, 7vw, 74px) var(--page-pad) clamp(56px, 10vw, 112px);
    }

    .page-title,
    .section-title {
      margin: 0;
      color: var(--heading);
      font-weight: 800;
      line-height: .82;
      letter-spacing: -.085em;
      text-transform: uppercase;
    }

    .page-title {
      margin-left: clamp(8px, 1.3vw, 15px);
      margin-bottom: clamp(34px, 6vw, 66px);
      font-size: clamp(4rem, 12.5vw, 8rem);
    }

    .account-list,
    .holdings-list {
      display: grid;
      gap: clamp(12px, 1.7vw, 18px);
    }

    .account-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, auto);
      align-items: center;
      gap: 14px;
      min-height: clamp(76px, 14.8vw, 160px);
      padding: clamp(16px, 3.6vw, 38px) clamp(24px, 5.7vw, 62px);
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface);
    }

    .account-label,
    .account-value {
      color: var(--lime);
      font-size: clamp(1.55rem, 5.6vw, 3.8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.065em;
    }

    .account-label { white-space: nowrap; }
    .account-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      letter-spacing: -.07em;
    }

    .account-value.is-animating {
      animation: value-in .85s cubic-bezier(.2, .75, .25, 1) both;
    }

    @keyframes value-in {
      0% { opacity: .08; transform: translateY(14px) scale(.92); filter: blur(7px); }
      60% { opacity: 1; transform: translateY(-2px) scale(1.03); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .section-title {
      margin: clamp(74px, 10vw, 112px) 0 clamp(24px, 4vw, 42px) clamp(8px, 1.3vw, 15px);
      font-size: clamp(3.75rem, 11.5vw, 7.35rem);
    }

    .holding-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: clamp(46px, 7.4vw, 80px);
      padding: 12px clamp(24px, 5.7vw, 62px);
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface);
    }

    .holding-name,
    .holding-weight {
      overflow: hidden;
      color: var(--text);
      font-size: clamp(1rem, 3.25vw, 2.18rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.045em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .holding-weight {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .footer-name {
      margin: clamp(84px, 12vw, 140px) 0 0;
      color: var(--lime);
      font-size: clamp(1.85rem, 5.3vw, 3.75rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.08em;
      text-align: center;
    }

    .data-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .pull-refresh {
      position: fixed;
      z-index: 2;
      top: -52px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      background: #181818;
      color: var(--text);
      font-size: .75rem;
      font-weight: 700;
      opacity: 0;
      transform: translateX(-50%);
      transition: top .2s ease, opacity .2s ease;
    }

    .pull-refresh.visible { top: 12px; opacity: 1; }
    .pull-refresh.loading .pull-arrow { animation: spin .8s linear infinite; }
    .pull-arrow { color: var(--lime); }
    @keyframes spin { to { transform: rotate(360deg); } }

    :focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }

    @media (max-width: 370px) {
      .page { padding-left: 20px; padding-right: 20px; }
      .account-row, .holding-row { padding-left: 20px; padding-right: 20px; }
      .account-row { gap: 8px; }
      .account-label, .account-value { font-size: 1.42rem; }
      .holding-name, .holding-weight { font-size: .93rem; }
    }
  </style>
</head>
<body>
  <div class="pull-refresh" id="pullRefresh" aria-hidden="true"><span class="pull-arrow" id="pullArrow">↓</span><span id="pullText">PULL TO REFRESH</span></div>

  <main class="page">
    <h1 class="page-title">ACCOUNTS</h1>

    <section class="account-list" aria-label="QQQM 持仓数据">
      <div class="account-row"><span class="account-label">代码</span><span class="account-value" id="symbolValue">QQQM</span></div>
      <div class="account-row"><span class="account-label">持有</span><span class="account-value" id="sharesValue">4.0000</span></div>
      <div class="account-row"><span class="account-label">成本</span><span class="account-value" id="costValue">$276.63</span></div>
      <div class="account-row"><span class="account-label">现价</span><span class="account-value" id="priceValue">$294.69</span></div>
      <div class="account-row"><span class="account-label">盈亏</span><span class="account-value" id="profitValue">+$56.63</span></div>
      <div class="account-row"><span class="account-label">价值</span><span class="account-value" id="valueValue">¥8762.63</span></div>
      <div class="account-row"><span class="account-label">最大回撤</span><span class="account-value" id="drawdownValue">−$62.63</span></div>
    </section>

    <section aria-labelledby="holdings-heading">
      <h2 class="section-title" id="holdings-heading">HOLDINGS</h2>
      <div class="holdings-list" id="holdingsList"></div>
    </section>

    <p class="footer-name">朱莹筑&amp;朱侯锡</p>
    <p class="data-status" id="dataStatus" aria-live="polite">DATA — LOADING</p>
  </main>

  <script>
    const CONFIG = {
      dataUrl: "./data/data.json",
      runtimeQuoteEndpoint: "",
      fxEndpoint: "https://api.frankfurter.dev/v2/rate/USD/CNY",
      refreshMs: 5 * 60 * 1000
    };

    const FALLBACK_DATA = {
      symbol: "QQQM",
      shares: 4,
      costUsd: 276.63,
      profitUsd: 56.63,
      valueCny: 8762.63,
      maxDrawdownUsd: -62.63,
      averageCostUsd: 276.63,
      quote: { price: 294.69, change: 0, changePercent: 0 },
      fx: { usdCny: 7.4354, date: "2026-09-12" },
      holdings: [
        { name: "NVIDIA Corp", ticker: "NVDA", weight: 7.60 },
        { name: "Apple Inc", ticker: "AAPL", weight: 6.67 },
        { name: "Alphabet Inc", ticker: "GOOGL / GOOG", weight: 6.29 },
        { name: "Micron Technology Inc", ticker: "MU", weight: 5.64 },
        { name: "Microsoft Corp", ticker: "MSFT", weight: 4.35 },
        { name: "Advanced Micro Devices Inc", ticker: "AMD", weight: 4.11 },
        { name: "Amazon.com Inc", ticker: "AMZN", weight: 4.03 },
        { name: "Tesla Inc", ticker: "TSLA", weight: 3.30 },
        { name: "Intel Corp", ticker: "INTC", weight: 3.04 },
        { name: "Broadcom Inc", ticker: "AVGO", weight: 2.81 }
      ],
      history: []
    };

    let state = FALLBACK_DATA;
    let isRefreshing = false;
    let pullStartY = 0;
    let pullDistance = 0;

    const $ = (id) => document.getElementById(id);
    const money = (value) => `$${Number(value || 0).toFixed(2)}`;
    const signedMoney = (value) => `${Number(value || 0) >= 0 ? "+" : "−"}${money(Math.abs(Number(value || 0)))}`;
    const cny = (value) => `¥${Number(value || 0).toFixed(2)}`;
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));

    function animateText(element, text) {
      element.classList.remove("is-animating");
      void element.offsetWidth;
      element.classList.add("is-animating");
      element.textContent = text;
    }

    function historicalMaxDrawdown(history) {
      let peak = -Infinity;
      let maxDrawdown = 0;
      for (const item of history || []) {
        const value = Number(item.valueUsd);
        if (!Number.isFinite(value)) continue;
        peak = Math.max(peak, value);
        if (peak > 0) maxDrawdown = Math.min(maxDrawdown, value - peak);
      }
      return maxDrawdown;
    }

    function renderAccount() {
      const shares = Number(state.shares || 0);
      const price = Number(state.quote?.price || 0);
      const fx = Number(state.fx?.usdCny || 0);
      const cost = Number.isFinite(Number(state.costUsd)) ? Number(state.costUsd) : Number(state.averageCostUsd || 0);
      const profit = Number.isFinite(Number(state.profitUsd)) ? Number(state.profitUsd) : price * shares - Number(state.averageCostUsd || 0) * shares;
      const valueCny = Number.isFinite(Number(state.valueCny)) ? Number(state.valueCny) : price * shares * fx;
      const maxDrawdown = Number.isFinite(Number(state.maxDrawdownUsd)) ? Number(state.maxDrawdownUsd) : historicalMaxDrawdown(state.history);

      animateText($("symbolValue"), escapeHtml(state.symbol || "QQQM"));
      animateText($("sharesValue"), shares.toFixed(4));
      animateText($("costValue"), money(cost));
      animateText($("priceValue"), money(price));
      animateText($("profitValue"), signedMoney(profit));
      animateText($("valueValue"), cny(valueCny));
      animateText($("drawdownValue"), signedMoney(maxDrawdown));
    }

    function renderHoldings() {
      $("holdingsList").innerHTML = (state.holdings || []).slice(0, 10).map((item) => `
        <div class="holding-row">
          <span class="holding-name">${escapeHtml(item.name)}</span>
          <span class="holding-weight">${Number(item.weight || 0).toFixed(2)}%</span>
        </div>`).join("");
    }

    async function fetchRuntimeData() {
      const response = await fetch(`${CONFIG.dataUrl}?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`data ${response.status}`);
      return response.json();
    }

    async function refreshFx() {
      const response = await fetch(`${CONFIG.fxEndpoint}?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`fx ${response.status}`);
      const result = await response.json();
      if (Number.isFinite(Number(result.rate))) state.fx = { ...(state.fx || {}), usdCny: Number(result.rate), date: result.date || state.fx?.date };
    }

    async function refreshData() {
      if (isRefreshing) return;
      isRefreshing = true;
      try {
        const next = await fetchRuntimeData();
        state = { ...FALLBACK_DATA, ...next, quote: { ...FALLBACK_DATA.quote, ...(next.quote || {}) }, fx: { ...FALLBACK_DATA.fx, ...(next.fx || {}) } };
        try { await refreshFx(); } catch (error) { /* workflow-saved FX remains available */ }
        if (CONFIG.runtimeQuoteEndpoint) {
          try {
            const response = await fetch(`${CONFIG.runtimeQuoteEndpoint}?symbol=${encodeURIComponent(state.symbol)}&t=${Date.now()}`, { cache: "no-store" });
            const quote = await response.json();
            if (Number.isFinite(Number(quote.c))) state.quote = { ...state.quote, price: Number(quote.c), change: Number(quote.d || 0), changePercent: Number(quote.dp || 0) };
          } catch (error) { /* static workflow data remains valid */ }
        }
      } catch (error) {
        /* The embedded design snapshot remains visible when opened without a server. */
      }
      renderAccount();
      renderHoldings();
      $("dataStatus").textContent = `DATA — ${new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date())}`;
      isRefreshing = false;
    }

    function bindPullToRefresh() {
      const indicator = $("pullRefresh");
      document.addEventListener("touchstart", (event) => { if (window.scrollY <= 2 && !isRefreshing) pullStartY = event.touches[0].clientY; }, { passive: true });
      document.addEventListener("touchmove", (event) => {
        if (!pullStartY || window.scrollY > 2 || isRefreshing) return;
        pullDistance = Math.max(0, Math.min(100, event.touches[0].clientY - pullStartY));
        if (pullDistance > 8) {
          indicator.classList.add("visible");
          indicator.style.top = `${Math.min(12 + pullDistance * .38, 48)}px`;
          $("pullText").textContent = pullDistance > 70 ? "RELEASE TO REFRESH" : "PULL TO REFRESH";
          $("pullArrow").style.transform = `rotate(${pullDistance > 70 ? 180 : 0}deg)`;
        }
      }, { passive: true });
      document.addEventListener("touchend", async () => {
        if (!pullStartY) return;
        const shouldRefresh = pullDistance > 70;
        pullStartY = 0;
        pullDistance = 0;
        if (shouldRefresh) {
          indicator.classList.add("loading");
          $("pullText").textContent = "UPDATING";
          await refreshData();
        }
        indicator.classList.remove("visible", "loading");
        indicator.style.top = "";
        $("pullArrow").style.transform = "";
      }, { passive: true });
    }

    bindPullToRefresh();
    renderAccount();
    renderHoldings();
    refreshData();
    window.setInterval(refreshData, CONFIG.refreshMs);
  </script>
</body>
</html>
